spring:
  application:
    name: salter-backend
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/salter}
    username: ${DATABASE_USERNAME:salter}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${SALTER_MAX_UPLOAD:6MB}
      max-request-size: ${SALTER_MAX_UPLOAD:6MB}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

salter:
  zone: America/Mexico_City
  security:
    # Secreto HMAC para firmar tokens (mínimo 32 caracteres). OBLIGATORIO en producción.
    jwt-secret: ${SALTER_JWT_SECRET:}
    jwt-ttl: ${SALTER_JWT_TTL:PT10H}
    cookie-name: SALTER_SESSION
    cookie-secure: ${SALTER_COOKIE_SECURE:false}
    cookie-same-site: ${SALTER_COOKIE_SAMESITE:Lax}
    cors-allowed-origins: ${SALTER_CORS_ORIGINS:http://localhost:3000}
    max-failed-logins: 5
    lock-duration: PT15M
  bootstrap:
    # Si la base no tiene usuarios, crea un administrador con estos datos (sólo la primera vez).
    admin-email: ${SALTER_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${SALTER_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${SALTER_BOOTSTRAP_ADMIN_NAME:Administrador SALTER}
  uploads:
    max-bytes: 5242880
    allowed-types: image/jpeg,image/png,image/webp,application/pdf
  imports:
    max-rows: 5000

logging:
  level:
    root: INFO
    mx.salter: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] [%X{userId:-}] %logger{36} - %m%n"

---
spring:
  config:
    activate:
      on-profile: dev
salter:
  dev:
    # Crea datos de ejemplo (remitente, usuarios por rol) SOLO si SALTER_DEV_PASSWORD está definido.
    seed-password: ${SALTER_DEV_PASSWORD:}
logging:
  level:
    mx.salter: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
salter:
  security:
    cookie-secure: ${SALTER_COOKIE_SECURE:true}
springdoc:
  swagger-ui:
    enabled: ${SALTER_SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SALTER_SWAGGER_ENABLED:false}
logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","requestId":"%X{requestId:-}","userId":"%X{userId:-}","logger":"%logger{36}","msg":"%replace(%m){''"'',''\\"''}"}%n'
